<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Register · Whitmore Vance LLP</title>
<link rel="stylesheet" href="/law/css/theme.css?v=20260801b">
<link rel="stylesheet" href="/law/css/endurance.css?v=20260801b">
<link rel="stylesheet" href="/law/css/demo.css?v=20260801b">
<link rel="stylesheet" href="/law/css/lawfirm.css?v=20260801b">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="root"></div></main>

<script src="/law/vendor/chart.umd.min.js"></script>
<script src="/law/js/data.js"></script>
<script src="/law/js/util.js"></script>
<script src="/law/js/nav.js"></script>
<script>
renderTopbar();

/* filter state — var, before the first render() (TDZ trap) */
var mtSearch = '';
var mtPractice = 'all';
var mtOffice = 'all';
var mtFee = 'all';
var mtStatus = 'open';
var mtFlag = 'all';
var mtSort = 'revenue';
var mtLimit = 60;

function mtSet(k, v) {
  if (k === 'search') mtSearch = (v || '').toLowerCase();
  if (k === 'practice') mtPractice = v;
  if (k === 'office') mtOffice = v;
  if (k === 'fee') mtFee = v;
  if (k === 'status') mtStatus = v;
  if (k === 'flag') mtFlag = v;
  if (k === 'sort') mtSort = v;
  mtLimit = 60; render();
}
function mtMore() { mtLimit += 120; render(); }

function render() {
  var M = window.MODEL;
  if (!currentPersona()) return;
  var money = can('fin');
  var margin = can('margin');

  var all = scopeMatters(M.matters);

  var rows = all.filter(function (m) {
    if (mtStatus === 'open' && !m.active) return false;
    if (mtStatus === 'closed' && m.active) return false;
    if (mtPractice !== 'all' && m.practice !== mtPractice) return false;
    if (mtOffice !== 'all' && m.office !== mtOffice) return false;
    if (mtFee !== 'all' && m.feeLabel !== mtFee) return false;
    if (mtFlag === 'overbudget' && !m.overBudget) return false;
    if (mtFlag === 'loss' && !(m.active && m.margin < 0)) return false;
    if (mtFlag === 'wip' && !(m.active && m.wip > 60000)) return false;
    if (mtFlag === 'ebill' && !m.ebill) return false;
    if (mtSearch) {
      var hay = (m.name + ' ' + m.clientName + ' ' + m.id + ' ' + m.partnerName).toLowerCase();
      if (hay.indexOf(mtSearch) === -1) return false;
    }
    return true;
  });

  var sorters = {
    revenue: function (a, b) { return b.collected - a.collected; },
    margin:  function (a, b) { return a.margin - b.margin; },
    wip:     function (a, b) { return b.wip - a.wip; },
    hours:   function (a, b) { return b.hours - a.hours; },
    opened:  function (a, b) { return a.opened < b.opened ? 1 : -1; },
  };
  rows.sort(sorters[mtSort] || sorters.revenue);

  var R = M.rollup(rows);
  var openAll = all.filter(function (m) { return m.active; });

  /* ---------- KPIs ---------- */
  var kpis = [];
  kpis.push(kpi('Matters shown', fmtN(rows.length),
    'of ' + fmtN(all.length) + ' in the register', ''));
  kpis.push(kpi('Open', fmtN(openAll.length),
    fmtN(all.length - openAll.length) + ' closed in the period', ''));
  if (money) {
    kpis.push(kpi('Revenue — shown', fmtK(R.collected),
      mtStatus === 'all' && mtPractice === 'all' && mtOffice === 'all' && mtFee === 'all' && mtFlag === 'all' && !mtSearch
        ? '<div class="kpi-foot">' + tie('/law/', 'Dashboard') + '</div>' : 'filtered subset', ''));
    kpis.push(kpi('Unbilled WIP — shown', fmtK(R.wip),
      '<div class="kpi-foot">' + tie('/law/lockup/', 'Lockup') + '</div>', 'amber'));
  }
  kpis.push(kpi('Over budget', fmtN(all.filter(function (m) { return m.active && m.overBudget; }).length),
    'active matters past the agreed budget', 'amber',
    'Standard value more than 5% above the agreed budget|Budget from Elite 3E, burn computed in-portal'));
  if (margin) {
    kpis.push(kpi('Loss-making', fmtN(all.filter(function (m) { return m.active && m.margin < 0; }).length),
      '<div class="kpi-foot">' + tie('/law/profitability/', 'Profitability') + '</div>', 'amber'));
  }
  kpis.push(kpi('Average matter size', money ? fmtK(R.collected / Math.max(1, rows.length)) : fmtN(R.hours / Math.max(1, rows.length), 0) + ' hrs',
    money ? 'collected, shown set' : 'hours, shown set', ''));
  kpis.push(kpi('Non-hourly work', fmtPct(all.filter(function (m) { return m.fee !== 'hourly'; }).length / all.length * 100),
    'of matters' + '<div class="kpi-foot">' + tie('/law/afa/', 'Fee Arrangements') + '</div>', ''));

  /* ---------- controls ---------- */
  var sel = function (key, label, opts, cur) {
    return '<select onchange="mtSet(\'' + key + '\',this.value)" title="' + label + '" ' +
      'style="font:inherit;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:var(--radius-sm);' +
      'border:1px solid ' + (cur !== 'all' && cur !== 'open' && cur !== 'revenue' ? 'var(--color-blue)' : 'var(--color-border)') + ';' +
      'background:var(--color-bg-3);color:var(--color-cloud-whisper)">' +
      opts.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select>';
  };
  var controls =
    sel('status', 'Status', [['open', 'Open matters'], ['closed', 'Closed'], ['all', 'All statuses']], mtStatus) + ' ' +
    sel('practice', 'Practice', [['all', 'All practices']].concat(M.practices.map(function (p) { return [p.name, p.name]; })), mtPractice) + ' ' +
    sel('office', 'Office', [['all', 'All offices']].concat(M.offices.map(function (o) { return [o.id, o.name]; })), mtOffice) + ' ' +
    sel('fee', 'Fee type', [['all', 'All fee types']].concat([...new Set(M.matters.map(function (m) { return m.feeLabel; }))].map(function (f) { return [f, f]; })), mtFee) + ' ' +
    sel('flag', 'Flag', [['all', 'No flag filter'], ['overbudget', 'Over budget'], ['loss', 'Loss-making'], ['wip', 'WIP over $60K'], ['ebill', 'E-billed']], mtFlag) + ' ' +
    sel('sort', 'Sort', [['revenue', 'Sort: revenue'], ['margin', 'Sort: worst margin'], ['wip', 'Sort: WIP'], ['hours', 'Sort: hours'], ['opened', 'Sort: newest']], mtSort) +
    ' <input type="search" class="demo-search" placeholder="Search matters, clients, partners…" oninput="mtSet(\'search\',this.value)" value="' + esc(mtSearch) + '" style="min-width:230px;margin-left:6px">';

  /* ---------- register ---------- */
  var page = rows.slice(0, mtLimit);
  var tbl = '<div class="demo-tbl-wrap grid-scroll" style="max-height:660px"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Matter</th><th>Client</th><th>Practice</th><th>Office</th>' +
    '<th>Billing partner</th><th>Fee</th><th class="r">Hours</th>' +
    (money ? '<th class="r">Billed</th><th class="r">Collected</th>' : '') +
    (margin ? '<th class="r">Margin</th>' : '') +
    (money ? '<th class="r">WIP</th><th class="r">AR</th>' : '') +
    '<th class="r">Budget</th><th>Status</th></tr></thead><tbody>' +
    page.map(function (m) {
      var off = M.offices.find(function (o) { return o.id === m.office; });
      var burn = m.budget > 0 ? m.standardValue / m.budget : 0;
      return '<tr><td class="first-sticky"><b>' + esc(m.name.slice(0, 46)) + '</b>' +
          '<div style="font-size:10.5px;color:var(--color-slate-hint)">' + m.id + ' · opened ' + fmtDate(m.opened) + '</div></td>' +
        '<td style="font-size:11.5px">' + esc(m.clientName) + '</td>' +
        '<td style="font-size:11.5px">' + esc(m.practice) + '</td>' +
        '<td style="font-size:11.5px">' + esc(off ? off.name : m.office) + '</td>' +
        '<td style="font-size:11.5px">' + esc(m.partnerName) + '</td>' +
        '<td style="font-size:11px">' + esc(m.feeLabel) + '</td>' +
        '<td class="r">' + fmtN(m.hours, 0) + '</td>' +
        (money ? '<td class="r">' + fmtK(m.billed) + '</td><td class="r"><b>' + fmtK(m.collected) + '</b></td>' : '') +
        (margin ? '<td class="r" style="color:' + (m.margin < 0 ? 'var(--color-red)' : '') + '">' + fmtK(m.margin) + '</td>' : '') +
        (money ? '<td class="r">' + fmtK(m.wip) + '</td><td class="r">' + fmtK(m.arTotal) + '</td>' : '') +
        '<td class="r">' + (m.budget > 0
          ? '<span data-exp="Budget burn|Budget ' + fmt$(m.budget) + '|Standard value ' + fmt$(m.standardValue) + '|' + fmtPct(burn * 100) + ' of budget">' +
            fmtPct(burn * 100) + '</span>' : '<span style="color:var(--color-slate-hint)">none</span>') + '</td>' +
        '<td>' + (m.active
            ? (m.overBudget ? pill('OVER BUDGET', 'red') : (margin && m.margin < 0 ? pill('LOSS', 'red') : pill('OPEN', 'green')))
            : pill('CLOSED', 'blue')) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td class="first-sticky"><b>' + fmtN(rows.length) + ' of ' + fmtN(all.length) + ' matters</b></td>' +
      '<td></td><td></td><td></td><td></td><td></td>' +
      '<td class="r"><b>' + fmtN(R.hours, 0) + '</b></td>' +
      (money ? '<td class="r"><b>' + fmtK(R.billed) + '</b></td><td class="r"><b>' + fmtK(R.collected) + '</b></td>' : '') +
      (margin ? '<td class="r"><b>' + fmtK(R.margin) + '</b></td>' : '') +
      (money ? '<td class="r"><b>' + fmtK(R.wip) + '</b></td><td class="r"><b>' + fmtK(R.arTotal) + '</b></td>' : '') +
      '<td></td><td></td></tr></tfoot></table></div>' +
    (rows.length > mtLimit
      ? '<div style="text-align:center;margin-top:14px"><button onclick="mtMore()" style="font:inherit;font-size:11.5px;font-weight:700;padding:9px 20px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--color-border);background:var(--color-bg-3);color:var(--color-cloud-whisper)">Show ' + Math.min(120, rows.length - mtLimit) + ' more</button></div>'
      : '') +
    (rows.length === all.length && money
      ? '<div style="margin-top:12px"><span class="tie">Register ties to the firm dashboard — ' + fmt$2(R.collected) + '</span></div>'
      : money ? '<div style="margin-top:12px;font-size:12px;color:var(--color-text-muted)">Filtered view — ' + fmtK(R.collected) + ' of ' + fmtK(M.rollup(all).collected) + '</div>' : '');

  var secHead = function (t, n) {
    return '<div class="sec-head"><h2>' + t + '</h2><span class="rule"></span>' + (n ? '<span class="note">' + n + '</span>' : '') + '</div>';
  };

  /* keep the KPI grid rectangular — 4 per row, never a dead cell */
  while (kpis.length % 4 !== 0) kpis.pop();

  document.getElementById('root').innerHTML =
    wallNotice() +
    hero('Matter register — ' + M.asOfLabel,
      fmtN(all.length) + ' matters. <em>Every one drillable.</em>',
      'Filter by practice, office, fee arrangement or flag. Totals follow the filter; the KPI band stays on the firm. ' +
      'Budget burn and margin come from the same computation the profitability page uses.',
      ['e3e', 'iman', 'adp', 'wv']) +
    '<div class="demo-kpis k4">' + kpis.join('') + '</div>' +
    secHead('Register', fmtN(rows.length) + ' of ' + fmtN(all.length) + ' shown') +
    panel('All matters', controls, tbl);
}

if (isSignedIn()) render();
</script>
</body>
</html>
