<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacity Planning · Whitmore Vance LLP</title>
<link rel="stylesheet" href="/law/css/theme.css?v=20260801d">
<link rel="stylesheet" href="/law/css/endurance.css?v=20260801d">
<link rel="stylesheet" href="/law/css/demo.css?v=20260801d">
<link rel="stylesheet" href="/law/css/lawfirm.css?v=20260801d">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="root"></div></main>

<script src="/law/vendor/chart.umd.min.js?v=20260802a"></script>
<script src="/law/js/data.js?v=20260802a"></script>
<script src="/law/js/util.js?v=20260802a"></script>
<script src="/law/js/analytics.js?v=20260802a"></script>
<script src="/law/js/nav.js?v=20260802a"></script>
<script>
renderTopbar();

/* levers — var, before the first render() (TDZ trap) */
var cpHorizon = 6;
var cpPipeline = 55;
var cpAttrition = 8;
function cpSet(k, v) {
  if (k === 'horizon') cpHorizon = parseInt(v, 10);
  if (k === 'pipeline') cpPipeline = parseFloat(v);
  if (k === 'attrition') cpAttrition = parseFloat(v);
  render();
}

function render() {
  var M = window.MODEL;
  if (!currentPersona()) return;

  var mine = scopeMatters(M.matters);
  var open = mine.filter(function (m) { return m.active; });

  /* forward demand: open matters run off over the horizon, plus weighted pipeline */
  var rows = M.practices.map(function (p) {
    var inP = open.filter(function (m) { return m.practice === p.name; });
    var tks = M.timekeepers.filter(function (t) { return t.practice === p.name; });

    /* remaining hours on open work — budget less burned, floored */
    var remaining = inP.reduce(function (s, m) {
      var rem = m.budget > 0 ? Math.max(0, (m.budget - m.standardValue) / (m.standardValue / m.hours || 1)) : m.hours * 0.28;
      return s + rem;
    }, 0);
    /* pipeline: a share of the group's current run-rate hours, scaled by the lever */
    var runRate = inP.reduce(function (s, m) { return s + m.hours; }, 0) / 12;
    var pipeline = runRate * cpHorizon * (cpPipeline / 100) * 0.45;
    var demand = remaining * Math.min(1, cpHorizon / 9) + pipeline;

    /* capacity over the horizon, less expected attrition */
    var capacity = tks.reduce(function (s, t) { return s + t.target; }, 0) / 12 * cpHorizon * (1 - cpAttrition / 100 * (cpHorizon / 12));
    var gap = capacity - demand;
    var heads = gap / (1700 / 12 * cpHorizon);

    return { p: p.name, tks: tks.length, demand: demand, capacity: capacity, gap: gap, heads: heads,
             util: capacity ? demand / capacity : 0, matters: inP.length };
  }).sort(function (a, b) { return a.gap - b.gap; });

  var totDemand = rows.reduce(function (s, r) { return s + r.demand; }, 0);
  var totCap = rows.reduce(function (s, r) { return s + r.capacity; }, 0);
  var short = rows.filter(function (r) { return r.gap < 0; });
  var slack = rows.filter(function (r) { return r.util < 0.75; });

  /* individuals: reuse the roster distribution */
  var byPracHours = {};
  mine.forEach(function (m) { byPracHours[m.practice] = (byPracHours[m.practice] || 0) + m.hours; });
  var people = [];
  M.practices.forEach(function (p) {
    var pool = M.timekeepers.filter(function (t) { return t.practice === p.name; });
    var w = pool.map(function (t) { var s = parseInt(t.id.slice(2), 10); return t.target * (0.55 + ((s * 37) % 100) / 110); });
    var wSum = w.reduce(function (a, b) { return a + b; }, 0);
    pool.forEach(function (t, i) {
      var hrs = (byPracHours[p.name] || 0) * (w[i] / wSum);
      people.push({ t: t, hours: hrs, util: hrs / t.target });
    });
  });
  var over = people.filter(function (x) { return x.util >= 1.10; }).sort(function (a, b) { return b.util - a.util; });
  var under = people.filter(function (x) { return x.util < 0.65; }).sort(function (a, b) { return a.util - b.util; });

  var kpis = [
    kpi('Horizon', cpHorizon + ' months', 'demand modelled forward', ''),
    kpi('Forward demand', fmtN(totDemand, 0) + ' hrs', 'open work + weighted pipeline', ''),
    kpi('Available capacity', fmtN(totCap, 0) + ' hrs', 'after ' + cpAttrition + '% attrition', ''),
    kpi('Net position', (totCap - totDemand >= 0 ? '+' : '') + fmtN(totCap - totDemand, 0) + ' hrs',
      totCap >= totDemand ? 'capacity available' : 'short of capacity', totCap >= totDemand ? 'green' : 'amber'),
    kpi('Groups short of people', fmtN(short.length), short.length ? esc(short[0].p) + ' worst' : 'none', short.length ? 'amber' : 'green'),
    kpi('Groups with slack', fmtN(slack.length), 'under 75% committed', slack.length ? '' : 'green'),
    kpi('Over-allocated people', fmtN(over.length), 'above 110% of target', over.length ? 'amber' : 'green',
      'Individuals carrying materially more than target|The group can look balanced while these people are not'),
    kpi('Under-allocated people', fmtN(under.length), 'below 65% of target', under.length ? 'amber' : 'green',
      'Capacity available right now|These are the people who should be taking work from the list above'),
  ];
  while (kpis.length % 4 !== 0) kpis.pop();

  /* levers */
  var sl = function (label, key, val, min, max, step, unit, note) {
    return '<div style="margin-bottom:18px">' +
      '<label style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-slate-hint);margin-bottom:8px">' +
      '<span>' + label + '</span><span style="color:var(--color-blue)">' + val + unit + '</span></label>' +
      '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" oninput="cpSet(\'' + key + '\',this.value)" style="width:100%;accent-color:var(--color-blue)">' +
      (note ? '<div style="font-size:11px;color:var(--color-text-muted);margin-top:6px;line-height:1.5">' + note + '</div>' : '') +
      '</div>';
  };
  var levers =
    '<div style="display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:start" class="row2">' +
    '<div>' +
      sl('Planning horizon', 'horizon', cpHorizon, 3, 18, 3, ' mo', 'How far forward to model open work and pipeline.') +
      sl('Pipeline conversion', 'pipeline', cpPipeline, 0, 100, 5, '%', 'What share of the weighted pipeline actually lands. The honest number is lower than the one in the pitch deck.') +
      sl('Expected attrition', 'attrition', cpAttrition, 0, 25, 1, '%', 'Annualised. Capacity is reduced pro rata over the horizon.') +
    '</div>' +
    '<div id="cp-out"></div></div>';

  /* group table */
  var tbl = '<div class="demo-tbl-wrap grid-scroll"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Practice group</th><th class="r">People</th><th class="r">Open matters</th>' +
    '<th class="r">Forward demand</th><th class="r">Capacity</th><th class="r">Gap</th><th class="r">Committed</th>' +
    '<th class="r">Heads implied</th><th>Reading</th></tr></thead><tbody>' +
    rows.map(function (r) {
      var tone = r.gap < 0 ? 'red' : r.util < 0.75 ? 'amber' : 'green';
      var read = r.gap < 0 ? 'Short — hire, borrow or turn work away'
        : r.util < 0.75 ? 'Slack — should be taking work from the groups above'
        : 'Balanced';
      return '<tr><td class="first-sticky"><b>' + esc(r.p) + '</b></td>' +
        '<td class="r">' + fmtN(r.tks) + '</td>' +
        '<td class="r">' + fmtN(r.matters) + '</td>' +
        '<td class="r">' + fmtN(r.demand, 0) + '</td>' +
        '<td class="r" style="color:var(--color-text-muted)">' + fmtN(r.capacity, 0) + '</td>' +
        '<td class="r" style="color:' + (r.gap < 0 ? 'var(--color-red)' : 'var(--color-green)') + '"><b>' +
          (r.gap >= 0 ? '+' : '') + fmtN(r.gap, 0) + '</b></td>' +
        '<td class="r">' + fmtPct(r.util * 100) + '</td>' +
        '<td class="r" style="color:' + (r.heads < 0 ? 'var(--color-red)' : '') + '"><b>' +
          (r.heads >= 0 ? '+' : '') + r.heads.toFixed(1) + '</b></td>' +
        '<td>' + pill(read, tone) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td class="first-sticky"><b>Firm</b></td>' +
      '<td class="r"><b>' + fmtN(M.timekeepers.length) + '</b></td>' +
      '<td class="r"><b>' + fmtN(open.length) + '</b></td>' +
      '<td class="r"><b>' + fmtN(totDemand, 0) + '</b></td>' +
      '<td class="r"><b>' + fmtN(totCap, 0) + '</b></td>' +
      '<td class="r" style="color:' + (totCap - totDemand < 0 ? 'var(--color-red)' : 'var(--color-green)') + '"><b>' +
        (totCap - totDemand >= 0 ? '+' : '') + fmtN(totCap - totDemand, 0) + '</b></td>' +
      '<td class="r"><b>' + fmtPct(totDemand / totCap * 100) + '</b></td><td></td><td></td></tr></tfoot></table></div>';

  /* the rebalancing list — the actual decision */
  var rebal = '<div class="row2">' +
    panel('Carrying too much', srcChip('e3e') + ' · top 10',
      '<div class="rank">' + over.slice(0, 10).map(function (x, i) {
        return '<div class="rk"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span><span class="t">' + esc(x.t.name) + '</span>' +
          '<span class="s">' + esc(x.t.clsLabel) + ' · ' + esc(x.t.practice) + '</span></span>' +
          '<span class="v" style="color:var(--color-red)">' + fmtPct(x.util * 100) +
          '<small>' + fmtN(x.hours, 0) + ' of ' + fmtN(x.t.target, 0) + ' hrs</small></span></div>';
      }).join('') + '</div>') +
    panel('Available now', srcChip('e3e') + ' · top 10',
      '<div class="rank">' + under.slice(0, 10).map(function (x, i) {
        return '<div class="rk"><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span><span class="t">' + esc(x.t.name) + '</span>' +
          '<span class="s">' + esc(x.t.clsLabel) + ' · ' + esc(x.t.practice) + '</span></span>' +
          '<span class="v" style="color:var(--color-green)">' + fmtPct(x.util * 100) +
          '<small>' + fmtN(x.t.target - x.hours, 0) + ' hrs free</small></span></div>';
      }).join('') + '</div>') +
    '</div>';

  var secHead = function (t, n) {
    return '<div class="sec-head"><h2>' + t + '</h2><span class="rule"></span>' + (n ? '<span class="note">' + n + '</span>' : '') + '</div>';
  };

  document.getElementById('root').innerHTML =
    wallNotice() +
    hero('Capacity planning — ' + M.asOfLabel,
      short.length
        ? fmtN(short.length) + ' groups are <em>short</em> while ' + fmtN(under.length) + ' people sit under 65%.'
        : 'Demand and capacity, <em>' + cpHorizon + ' months forward</em>.',
      'Forward demand from open matters and weighted pipeline against the hours the firm actually has, ' +
      'with the over- and under-allocated named rather than averaged away. ' + tie('/law/people/', 'Roster'),
      ['e3e', 'adp', 'crm', 'wv']) +
    '<div class="demo-kpis k4">' + kpis.join('') + '</div>' +

    secHead('Model it', 'three levers') +
    panel('Assumptions', srcChip('wv'), levers, ' style="margin-bottom:18px"') +

    secHead('By practice group', cpHorizon + '-month horizon') +
    panel('Demand vs capacity', srcChip('e3e') + ' ' + srcChip('adp'), tbl, ' style="margin-bottom:18px"') +

    secHead('The rebalancing list', 'the actual staffing decision') +
    rebal;

  renderOut(rows, totDemand, totCap);
}

function renderOut(rows, totDemand, totCap) {
  var el = document.getElementById('cp-out');
  if (!el) return;
  var gap = totCap - totDemand;
  var heads = gap / (1700 / 12 * cpHorizon);
  var short = rows.filter(function (r) { return r.gap < 0; });
  el.innerHTML =
    '<div style="background:var(--color-bg-3);border:1px solid var(--color-border);border-left:3px solid ' +
      (gap >= 0 ? 'var(--color-green)' : 'var(--color-red)') + ';border-radius:var(--radius-md);padding:20px 22px">' +
      '<div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">Net position over ' + cpHorizon + ' months</div>' +
      '<div style="font-size:32px;font-weight:800;letter-spacing:-.02em;margin:5px 0 2px;color:' + (gap >= 0 ? 'var(--color-green)' : 'var(--color-red)') + '">' +
        (gap >= 0 ? '+' : '') + fmtN(gap, 0) + ' hrs</div>' +
      '<div style="font-size:12.5px;color:var(--color-text-muted);line-height:1.6">' +
        (gap >= 0
          ? 'The firm has <b>' + heads.toFixed(1) + '</b> full-time equivalents of headroom at these assumptions — but it is not evenly held. '
          : 'The firm is <b>' + Math.abs(heads).toFixed(1) + '</b> full-time equivalents short at these assumptions. ') +
        (short.length ? '<b>' + esc(short[0].p) + '</b> is the tightest group.' : 'No group is currently short.') +
      '</div>' +
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--color-border);display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        '<div><div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">Demand</div>' +
        '<div style="font-size:19px;font-weight:800;margin-top:4px">' + fmtN(totDemand, 0) + ' hrs</div></div>' +
        '<div><div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">Capacity</div>' +
        '<div style="font-size:19px;font-weight:800;margin-top:4px">' + fmtN(totCap, 0) + ' hrs</div></div>' +
      '</div></div>';
}

if (isSignedIn()) render();
</script>
</body>
</html>
