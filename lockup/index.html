<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockup — WIP &amp; AR · Whitmore Vance LLP</title>
<link rel="stylesheet" href="/law/css/theme.css?v=20260801d">
<link rel="stylesheet" href="/law/css/endurance.css?v=20260801d">
<link rel="stylesheet" href="/law/css/demo.css?v=20260801d">
<link rel="stylesheet" href="/law/css/lawfirm.css?v=20260801d">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="root"></div></main>

<script src="/law/vendor/chart.umd.min.js"></script>
<script src="/law/js/data.js"></script>
<script src="/law/js/util.js"></script>
<script src="/law/js/analytics.js"></script>
<script src="/law/js/nav.js"></script>
<script>
renderTopbar();

/* filter state — var, before the first render() */
var lkView = 'ar';
var lkDays = 5;
function lkSet(v) { lkView = v; render(); }
function lkDaysSet(v) { lkDays = parseFloat(v); renderSaving(); }

function render() {
  var M = window.MODEL, F = M.firm, A = M.aging;
  if (!currentPersona()) return;
  if (!can('fin')) {
    document.getElementById('root').innerHTML = hero('Lockup', 'Restricted.',
      'Lockup requires financial access.', ['e3e']);
    return;
  }

  var mine = scopeMatters(M.matters);
  var R = M.rollup(mine);
  var perDay = R.collected / 365;
  var wipDays = R.wip / perDay, arDays = R.arTotal / perDay;

  var kpis = [
    kpi('Lockup', fmtN(wipDays + arDays, 0) + ' days', 'ties to the dashboard ' + tie('/law/', 'Dashboard'), 'amber',
      'WIP days + AR days|Revenue per day = ' + fmt$(perDay) + '|Each day removed releases ' + fmtK(perDay) + ' of working capital, permanently'),
    kpi('Unbilled WIP', fmtK(R.wip), fmtN(wipDays, 0) + ' days of revenue', 'amber',
      'Work recorded and not yet invoiced|' + fmt$2(R.wip) + '|Appears on the balance sheet ' + ''),
    kpi('Accounts receivable', fmtK(R.arTotal), fmtN(arDays, 0) + ' days of revenue', 'amber',
      'Invoiced and not yet collected|' + fmt$2(R.arTotal)),
    kpi('Over 90 days', fmtK(R.a90 + R.a120), fmtPct((R.a90 + R.a120) / R.arTotal * 100) + ' of receivables',
      (R.a90 + R.a120) / R.arTotal > 0.12 ? 'amber' : '',
      'AR aged beyond 90 days|Collection probability falls sharply past this point'),
    kpi('One day of lockup', fmtK(perDay), 'of working capital', '',
      'Revenue ÷ 365|The unit every conversation about lockup should be conducted in'),
    kpi('Five days released', fmtK(perDay * 5), 'at 8% ≈ ' + fmtK(perDay * 5 * 0.08) + '/yr', 'green',
      'Cash released by taking five days out of lockup|Carrying value at the firm\'s revolver rate|Not new revenue — the firm\'s own money, arriving sooner'),
    kpi('Matters holding WIP', fmtN(mine.filter(function (m) { return m.wip > 0; }).length), 'active', ''),
    kpi('Worst single balance', fmtK(Math.max.apply(null, A.worst.map(function (m) { return m.ar.a90 + m.ar.a120; }))),
      'aged past 90 days', 'amber'),
  ];

  /* aging matrix by practice */
  var agTbl = '<div class="demo-tbl-wrap grid-scroll"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Practice group</th><th class="r">Unbilled WIP</th>' +
    A.buckets.map(function (b) { return '<th class="r">' + A.labels[b] + '</th>'; }).join('') +
    '<th class="r">Total AR</th><th class="r">&gt;90 days</th><th class="r">Lockup</th></tr></thead><tbody>' +
    Object.keys(A.byPractice).sort(function (a, b) { return A.byPractice[b].total - A.byPractice[a].total; })
      .map(function (p) {
        var x = A.byPractice[p], r = M.byPractice[p];
        var old = (x.a90 + x.a120) / x.total;
        return '<tr><td class="first-sticky"><b>' + esc(p) + '</b></td>' +
          '<td class="r">' + fmtK(x.wip) + '</td>' +
          A.buckets.map(function (b) { return '<td class="r">' + fmtK(x[b]) + '</td>'; }).join('') +
          '<td class="r"><b>' + fmtK(x.total) + '</b></td>' +
          '<td class="r" style="color:' + (old > 0.12 ? 'var(--color-red)' : 'var(--color-text-muted)') + '">' + fmtPct(old * 100) + '</td>' +
          '<td class="r">' + fmtN(r.lockupDays, 0) + 'd</td></tr>';
      }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td class="first-sticky"><b>Firm</b></td>' +
      '<td class="r"><b>' + fmtK(F.wip) + '</b></td>' +
      A.buckets.map(function (b) { return '<td class="r"><b>' + fmtK(F[b]) + '</b></td>'; }).join('') +
      '<td class="r"><b>' + fmtK(F.arTotal) + '</b></td>' +
      '<td class="r"><b>' + fmtPct((F.a90 + F.a120) / F.arTotal * 100) + '</b></td>' +
      '<td class="r"><b>' + fmtN(F.lockupDays, 0) + 'd</b></td></tr></tfoot></table></div>' +
    '<div style="margin-top:12px"><span class="tie">AR ties to the balance sheet — ' + fmt$2(F.arTotal) + '</span></div>';

  /* work queue */
  var list = lkView === 'ar' ? A.worst : A.wipOld;
  var queue = '<div class="demo-tbl-wrap grid-scroll" style="max-height:520px"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Matter</th><th>Client</th><th>Billing partner</th><th>Practice</th>' +
    (lkView === 'ar' ? '<th class="r">91–120</th><th class="r">120+</th><th class="r">Total &gt;90</th>' : '<th class="r">Unbilled WIP</th><th class="r">Hours</th>') +
    '<th class="r">Days</th><th>Action</th></tr></thead><tbody>' +
    list.slice(0, 25).map(function (m, i) {
      var amt = lkView === 'ar' ? (m.ar.a90 + m.ar.a120) : m.wip;
      var days = lkView === 'ar' ? 95 + (i * 7) % 88 : 34 + (i * 11) % 120;
      return '<tr><td class="first-sticky"><b>' + esc(m.name.slice(0, 40)) + '</b><div style="font-size:10.5px;color:var(--color-slate-hint)">' + m.id + '</div></td>' +
        '<td style="font-size:11.5px">' + esc(m.clientName) + '</td>' +
        '<td style="font-size:11.5px">' + esc(m.partnerName) + '</td>' +
        '<td style="font-size:11.5px">' + esc(m.practice) + '</td>' +
        (lkView === 'ar'
          ? '<td class="r">' + fmtK(m.ar.a90) + '</td><td class="r" style="color:var(--wv-burgundy)">' + fmtK(m.ar.a120) + '</td><td class="r"><b>' + fmtK(amt) + '</b></td>'
          : '<td class="r"><b>' + fmtK(amt) + '</b></td><td class="r">' + fmtN(m.hours, 0) + '</td>') +
        '<td class="r">' + days + '</td>' +
        '<td><button onclick="nudgeMatter(\'' + m.id + '\',\'' + esc(m.partnerName) + '\')" style="font:inherit;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--color-border);background:var(--color-bg-2);color:var(--color-cloud-whisper)">Escalate</button></td></tr>';
    }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td class="first-sticky"><b>Top 25 of ' + list.length + '</b></td><td></td><td></td><td></td>' +
      (lkView === 'ar' ? '<td></td><td></td>' : '') +
      '<td class="r"><b>' + fmtK(list.slice(0, 25).reduce(function (s, m) { return s + (lkView === 'ar' ? m.ar.a90 + m.ar.a120 : m.wip); }, 0)) + '</b></td>' +
      (lkView === 'ar' ? '' : '<td></td>') + '<td></td><td></td></tr></tfoot></table></div>';

  var toggle = ['ar', 'wip'].map(function (k) {
    return '<button onclick="lkSet(\'' + k + '\')" style="font:inherit;font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;' +
      'border:1px solid ' + (k === lkView ? 'var(--color-blue)' : 'var(--color-border)') + ';background:' + (k === lkView ? 'var(--color-blue-pale)' : 'var(--color-bg-3)') +
      ';color:' + (k === lkView ? 'var(--color-blue)' : 'var(--color-cloud-whisper)') + '">' +
      (k === 'ar' ? 'Aged receivables' : 'Oldest unbilled WIP') + '</button>';
  }).join(' ');

  /* the release calculator */
  var calc =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center" class="lk-calc">' +
    '<div><label style="display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-slate-hint);margin-bottom:10px">Days removed from lockup</label>' +
    '<input type="range" min="0" max="25" step="1" value="' + lkDays + '" oninput="lkDaysSet(this.value)" style="width:100%;accent-color:var(--color-blue)">' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--color-slate-hint);margin-top:6px"><span>0</span><span>25 days</span></div>' +
    '<div style="font-size:12.5px;color:var(--color-text-muted);margin-top:16px;line-height:1.6">Firms that instrument lockup routinely take out ten to twenty days. ' +
    'The slider defaults to five because a number the CFO will not argue with is worth more than a number that is merely true.</div></div>' +
    '<div id="lk-out"></div></div>';

  /* keep the KPI grid rectangular — 4 per row, never a dead cell */
  while (kpis.length % 4 !== 0) kpis.pop();

  document.getElementById('root').innerHTML =
    wallNotice() +
    hero('Lockup — ' + M.asOfLabel,
      '<em>' + fmtK(R.wip + R.arTotal) + '</em> of work already done and not yet paid for.',
      fmtN(wipDays + arDays, 0) + ' days between doing the work and banking the money. It is the largest asset the firm owns ' +
      'and the one it manages least — because until now nobody could see it aged by matter, partner and client on one screen.',
      ['e3e', 'ebill', 'wv']) +
    '<div class="demo-kpis k4">' + kpis.join('') + '</div>' +
    panel('What removing days is worth', srcChip('wv') + ' · drag the slider', calc, ' style="margin-bottom:18px"') +
    panel('Aging by practice group', srcChip('e3e'), agTbl, ' style="margin-bottom:18px"') +
    panel('Collections work queue', toggle, queue);

  renderSaving();
}

function renderSaving() {
  var M = window.MODEL;
  var mine = scopeMatters(M.matters);
  var R = M.rollup(mine);
  var perDay = R.collected / 365;
  var released = perDay * lkDays;
  var el = document.getElementById('lk-out');
  if (!el) return;
  el.innerHTML =
    '<div style="background:var(--color-bg-3);border:1px solid var(--color-border);border-left:3px solid var(--color-green);border-radius:var(--radius-md);padding:20px 22px">' +
    '<div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">Cash released — one time</div>' +
    '<div style="font-size:32px;font-weight:800;letter-spacing:-.02em;margin:5px 0 2px;color:var(--color-green)">' + fmtK(released) + '</div>' +
    '<div style="font-size:12px;color:var(--color-text-muted)">' + lkDays + ' days × ' + fmt$(perDay) + ' per day</div>' +
    '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--color-border);display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
      '<div><div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">Annual carrying value</div>' +
      '<div style="font-size:20px;font-weight:800;margin-top:4px">' + fmtK(released * 0.08) + '</div>' +
      '<div style="font-size:11px;color:var(--color-slate-hint)">at an 8% revolver rate</div></div>' +
      '<div><div style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-slate-hint)">New lockup</div>' +
      '<div style="font-size:20px;font-weight:800;margin-top:4px">' + fmtN(((R.wip + R.arTotal) / perDay) - lkDays, 0) + ' days</div>' +
      '<div style="font-size:11px;color:var(--color-slate-hint)">from ' + fmtN((R.wip + R.arTotal) / perDay, 0) + ' today</div></div>' +
    '</div></div>';
}

function nudgeMatter(id, partner) {
  window.__apprDefs['lockup-' + id] = [{ role: 'pgl', label: 'Bill or write off ' + id + ' — aged past 90 days' }];
  slackNudge('lockup-' + id, 0);
}

if (isSignedIn()) render();
</script>
<style>@media(max-width:860px){ .lk-calc { grid-template-columns: 1fr !important; } }</style>
</body>
</html>
