<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firm Dashboard · Whitmore Vance LLP</title>
<link rel="stylesheet" href="/law/css/theme.css?v=20260801a">
<link rel="stylesheet" href="/law/css/endurance.css?v=20260801a">
<link rel="stylesheet" href="/law/css/demo.css?v=20260801a">
<link rel="stylesheet" href="/law/css/lawfirm.css?v=20260801a">
</head>
<body>
<div id="topbar"></div>

<main class="page">
<div class="demo-wrap" id="root"></div>
</main>

<script src="/law/vendor/chart.umd.min.js"></script>
<script src="/law/js/data.js"></script>
<script src="/law/js/util.js"></script>
<script src="/law/js/nav.js"></script>
<script>
renderTopbar();

/* page-scoped state — declared with var, before any render call (TDZ trap) */
var wvScope = 'firm';

function render() {
  var M = window.MODEL, F = M.firm;
  var me = currentPersona();
  if (!me) return;

  /* every page respects walls + practice scoping; totals follow the filtered set */
  var mine = scopeMatters(M.matters);
  var scoped = mine.length !== M.matters.length;
  var R = scoped ? M.rollup(mine) : F;
  if (scoped) {
    R.realization = R.collected / R.standardValue;
    R.marginPct = R.margin / R.collected;
    R.effectiveRate = R.collected / R.hours;
    R.standardRate = R.standardValue / R.hours;
    R.lockupDays = (R.wip + R.arTotal) / (R.collected / 365);
  }

  var money = can('fin');
  var margin = can('margin');

  /* ---------- KPI band ---------- */
  var kpis = [];
  if (money) {
    kpis.push(kpi('Revenue — TTM', fmtK(R.collected),
      'collected ' + M.asOfLabel + ' TTM ' + tie('/law/revenue/', 'Revenue'), '',
      'Collected fees, trailing 12 months|Sum of collections across ' + fmtN(R.matters) + ' matters|Source: Elite 3E cash receipts|Ties to Revenue & Realization page'));
    kpis.push(kpi('Realization', fmtPct(R.realization * 100),
      'billing ' + fmtPct(R.billingRealization ? R.billingRealization * 100 : (R.billed / R.standardValue) * 100) +
      ' × collection ' + fmtPct((R.collected / R.billed) * 100), 'green',
      'Collected ÷ standard value|Standard value = ' + fmt$(R.standardValue) + '|Collected = ' + fmt$(R.collected) + '|Every point is worth ' + fmtK(R.standardValue / 100) + ' a year'));
    kpis.push(kpi('Lockup', fmtN(R.lockupDays, 0) + ' days',
      'WIP ' + fmtN(R.wip / (R.collected / 365), 0) + ' + AR ' + fmtN(R.arTotal / (R.collected / 365), 0) + ' ' + tie('/law/lockup/', 'Lockup'), 'amber',
      'WIP days + AR days|Unbilled WIP = ' + fmt$(R.wip) + '|AR = ' + fmt$(R.arTotal) + '|Revenue per day = ' + fmt$(R.collected / 365) + '|One day = ' + fmtK(R.collected / 365) + ' of working capital'));
  }
  kpis.push(kpi('Utilization', fmtPct(F.utilization * 100),
    fmtN(R.hours, 0) + ' billable hours', '',
    'Billable hours ÷ target hours|Firm capacity = ' + fmtN(M.timekeepers.reduce(function (s, t) { return s + t.target; }, 0), 0) + ' target hours|Across ' + M.timekeepers.length + ' timekeepers'));
  if (margin) {
    kpis.push(kpi('Contribution margin', fmtPct(R.marginPct * 100),
      fmtK(R.margin) + ' after allocated overhead ' + tie('/law/profitability/', 'Profitability'), 'green',
      'Collections − cost of hours − allocated overhead − net disbursements|Cost rates from ADP payroll|Overhead allocated at ' + fmtPct(MODEL_OVERHEAD_K * 100, 0) + ' of direct work cost'));
  }
  kpis.push(kpi('Open matters', fmtN(R.active),
    fmtN(R.matters) + ' worked in the period ' + tie('/law/matters/', 'Matters'), ''));
  /* firm-wide comparatives only make sense for firm-wide roles — a group leader
     seeing firm RPL or firm client concentration next to their own revenue is
     a leak, not a feature */
  if (money && !scoped) {
    kpis.push(kpi('Revenue per lawyer', fmtK(R.collected / F.lawyers),
      F.lawyers + ' lawyers · ' + F.headcount + ' total', ''));
    kpis.push(kpi('Top-10 concentration', fmtPct(F.top10Share * 100),
      'top 25 = ' + fmtPct(F.top25Share * 100) + ' ' + tie('/law/clients/', 'Clients'), F.top10Share > 0.3 ? 'amber' : ''));
  } else if (money) {
    var myLawyers = M.lawyers.filter(function (t) { return t.practice === me.group; }).length || 1;
    kpis.push(kpi('Revenue per lawyer', fmtK(R.collected / myLawyers),
      myLawyers + ' lawyers in ' + esc(me.group), '',
      'Group collections ÷ lawyers in the group|' + fmt$(R.collected) + ' ÷ ' + myLawyers + '|Firm-wide figures are not shown to group-scoped roles'));
  }

  /* ---------- revenue leak waterfall ---------- */
  var wfRows = [
    ['Standard value', R.standardValue, '', 'Hours × standard rates before any reduction'],
    ['Discounts', -R.discount, 'leak', 'Negotiated and client-programme discounts'],
    ['Write-downs', -R.writeDown, 'leak', 'Time reduced by the billing partner before the bill went out'],
    ['Billed', R.billed, '', 'Value actually invoiced to clients'],
    ['Collection shortfall', -(R.billed - R.collected), 'leak', 'Short-pays, negotiated reductions and rejections after billing'],
    ['Collected', R.collected, 'net', 'Cash in the door'],
  ];
  var wfMax = R.standardValue;
  var wf = '<div class="wf">' + wfRows.map(function (r) {
    var val = Math.abs(r[1]);
    return '<div class="wf-row"><div class="wf-l">' + r[0] + '</div>' +
      '<div class="wf-track"><div class="wf-bar ' + r[2] + '" style="width:' + (val / wfMax * 100).toFixed(1) + '%"></div></div>' +
      '<div class="wf-v" data-exp="' + esc(r[0]) + '|' + esc(r[3]) + '|' + fmt$2(r[1]) + '">' + (r[1] < 0 ? '−' : '') + fmtK(val) + '</div></div>';
  }).join('') + '</div>' +
  '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--color-border);font-size:12.5px;color:var(--color-text-muted)">' +
    'The firm produced <b>' + fmtK(R.standardValue) + '</b> of work and collected <b>' + fmtK(R.collected) + '</b>. ' +
    'The gap — <b style="color:var(--wv-burgundy)">' + fmtK(R.standardValue - R.collected) + '</b> — is what a leak analysis costs a firm that cannot see it drawn. ' +
    'That is <b>' + fmt$(R.standardRate - R.effectiveRate) + '</b> of every billed hour.' +
  '</div>';

  /* ---------- practice group heat grid ----------
     Built from the SCOPED matter set, so a group-scoped user sees only their
     own group rather than every group's economics. */
  var pracMap = scoped ? M.rollupMap(mine, function (m) { return m.practice; }) : M.byPractice;
  var pracRows = M.practices.map(function (p) { return [p.name, pracMap[p.name]]; })
    .filter(function (x) { return x[1]; })
    .sort(function (a, b) { return b[1].collected - a[1].collected; });
  var lv = function (v, lo, hi) { return String(clamp(Math.ceil((v - lo) / (hi - lo) * 5), 1, 5)); };
  var heat = '<div class="demo-tbl-wrap grid-scroll"><table class="demo-tbl heat">' +
    '<thead><tr><th>Practice group</th><th class="r">Revenue</th><th class="r">Share</th><th class="r">Realization</th>' +
    (margin ? '<th class="r">Margin</th>' : '') + '<th class="r">Eff. rate</th><th class="r">Leverage</th><th class="r">Lockup</th><th class="r">Matters</th></tr></thead><tbody>' +
    pracRows.map(function (x) {
      var n = x[0], r = x[1];
      return '<tr><td><b>' + n + '</b></td>' +
        '<td class="r">' + fmtK(r.collected) + '</td>' +
        '<td class="r">' + fmtPct(r.collected / R.collected * 100) + '</td>' +
        '<td class="r h" data-lv="' + lv(r.realization, 0.83, 0.91) + '">' + fmtPct(r.realization * 100) + '</td>' +
        (margin ? '<td class="r h" data-lv="' + lv(r.marginPct, 0.30, 0.43) + '">' + fmtPct(r.marginPct * 100) + '</td>' : '') +
        '<td class="r">' + fmt$(r.effectiveRate) + '</td>' +
        '<td class="r">' + r.leverage.toFixed(2) + '</td>' +
        '<td class="r h" data-lv="' + lv(-r.lockupDays, -140, -90) + '">' + fmtN(r.lockupDays, 0) + 'd</td>' +
        '<td class="r">' + fmtN(r.matters) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td><b>Firm</b></td>' +
      '<td class="r"><b>' + fmtK(R.collected) + '</b></td><td class="r">100.0%</td>' +
      '<td class="r"><b>' + fmtPct(R.realization * 100) + '</b></td>' +
      (margin ? '<td class="r"><b>' + fmtPct(R.marginPct * 100) + '</b></td>' : '') +
      '<td class="r"><b>' + fmt$(R.effectiveRate) + '</b></td>' +
      '<td class="r"><b>' + ((R.hours - R.partnerHours) / R.partnerHours).toFixed(2) + '</b></td>' +
      '<td class="r"><b>' + fmtN(R.lockupDays, 0) + 'd</b></td>' +
      '<td class="r"><b>' + fmtN(R.matters) + '</b></td></tr></tfoot></table></div>';

  /* ---------- triage ---------- */
  var triage = '<div class="triage">' + M.triage.map(function (t) {
    return '<a class="tri ' + t.sev + '" href="' + t.href + '" style="text-decoration:none;color:inherit">' +
      '<span class="sev"></span><div><div class="t">' + t.t + '</div><div class="d">' + t.d + '</div></div>' +
      '<div class="a">' + t.a + '</div></a>';
  }).join('') + '</div>';

  /* ---------- assemble ---------- */
  document.getElementById('root').innerHTML =
    wallNotice() +
    hero('Firm dashboard — ' + M.asOfLabel,
      fmtN(R.matters) + ' matters. <em>One operating picture.</em>',
      'Every figure below is joined from the systems named on each panel and drills to the underlying record. ' +
      (scoped ? '<b>Scoped to your practice group and screened for ethical walls.</b>' :
                'Nothing here was exported, rekeyed or assembled by hand.'),
      ['e3e', 'iman', 'ebill', 'adp', 'wv']) +
    '<div class="demo-kpis" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">' + kpis.join('') + '</div>' +
    (money ? panel('Where the money goes', srcChip('e3e') + ' ' + srcChip('wv'), wf, ' style="margin-bottom:18px"') : '') +
    panel(scoped ? 'Group performance' : 'Practice group performance',
      srcChip('e3e') + ' ' + srcChip('adp') + ' · hover any cell for its derivation', heat, ' style="margin-bottom:18px"') +
    /* the triage list is a firm-wide read; group-scoped roles don't get it */
    (scoped ? '' : panel('Needs attention', 'joined across ' + Object.keys(SRC).length + ' connected systems', triage, ' style="margin-bottom:18px"')) +
    panel('Collections — 24 months', srcChip('e3e'),
      '<div class="demo-chart" style="height:280px"><canvas id="ch-rev"></canvas></div>');

  drawChart(M);
}

function drawChart(M) {
  var el = document.getElementById('ch-rev');
  if (!el || typeof Chart === 'undefined') return;
  var light = document.documentElement.getAttribute('data-theme') === 'light';
  var grid = light ? 'rgba(27,34,48,.08)' : 'rgba(255,255,255,.07)';
  var text = light ? '#5b6472' : '#a2a2ac';
  new Chart(el, {
    type: 'bar',
    data: {
      labels: M.series.map(function (s) { return s.label; }),
      datasets: [
        { label: 'Standard value', data: M.series.map(function (s) { return s.standard; }), backgroundColor: light ? 'rgba(43,74,139,.18)' : 'rgba(109,143,216,.20)', borderWidth: 0 },
        { label: 'Collected', data: M.series.map(function (s) { return s.collected; }), backgroundColor: light ? '#2b4a8b' : '#6d8fd8', borderWidth: 0 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: text, boxWidth: 10, font: { size: 11 } } },
        tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + fmt$(c.parsed.y); } } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: text, font: { size: 10 } } },
        y: { grid: { color: grid }, ticks: { color: text, font: { size: 10 }, callback: function (v) { return fmtK(v); } } },
      },
    },
  });
}

if (isSignedIn()) render();
</script>
</body>
</html>
