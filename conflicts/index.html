<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conflicts · Whitmore Vance LLP</title>
<link rel="stylesheet" href="/law/css/theme.css?v=20260802a">
<link rel="stylesheet" href="/law/css/endurance.css?v=20260802a">
<link rel="stylesheet" href="/law/css/demo.css?v=20260802a">
<link rel="stylesheet" href="/law/css/lawfirm.css?v=20260802a">
</head>
<body>
<div id="topbar"></div>
<main class="page"><div class="demo-wrap" id="root"></div></main>

<script src="/law/js/data.js?v=20260802a"></script>
<script src="/law/js/util.js?v=20260802a"></script>
<script src="/law/js/analytics.js?v=20260802a"></script>
<script src="/law/js/nav.js?v=20260802a"></script>
<script>
renderTopbar();

/* state — var, before the first render() (TDZ trap) */
var cfQuery = '';
var cfView = 'queue';
function cfSet(k, v) { if (k === 'q') cfQuery = v || ''; if (k === 'view') cfView = v; render(); }
function cfSearch() { cfView = 'search'; render(); }

var HIT_TYPES = [
  ['Direct adverse', 'The proposed adverse party is a current client', 'red'],
  ['Corporate family', 'An affiliate of the adverse party is a current client', 'amber'],
  ['Former client', 'The adverse party was a client within the look-back period', 'amber'],
  ['Positional', 'The firm argues the opposite position for another client', 'amber'],
  ['Prospective', 'The firm received confidential information in a pitch', 'amber'],
  ['Individual', 'A timekeeper has a personal relationship or interest', 'green'],
];
var RESOLUTIONS = [
  ['Cleared — no conflict', 'green'],
  ['Cleared — waiver on file', 'green'],
  ['Cleared — screen erected', 'amber'],
  ['Declined — unwaivable', 'red'],
  ['Pending — awaiting client response', 'amber'],
];

function HITS() {
  var M = window.MODEL;
  var recent = scopeMatters(M.matters).filter(function (m) { return m.opened >= '2026-01-01'; })
    .sort(function (a, b) { return a.opened < b.opened ? 1 : -1; });
  var out = [];
  recent.forEach(function (m, i) {
    var s = parseInt(m.id.replace(/\D/g, ''), 10);
    if (s % 4 !== 0) return;
    var n = 1 + (s % 3);
    for (var k = 0; k < n; k++) {
      var ht = HIT_TYPES[(s + k) % HIT_TYPES.length];
      var pending = i < 6 && k === 0;
      var res = pending ? RESOLUTIONS[4] : RESOLUTIONS[(s + k) % 4];
      var against = M.clientsRanked[(s + k * 17) % 200];
      out.push({
        m: m, type: ht[0], typeDesc: ht[1], tone: ht[2],
        against: against.name, res: res[0], resTone: res[1],
        pending: pending,
        days: pending ? 1 + (s % 9) : 0,
        raised: m.opened,
        by: m.partnerName,
      });
    }
  });
  return out;
}

function render() {
  var M = window.MODEL;
  if (!currentPersona()) return;
  if (!can('risk')) {
    document.getElementById('root').innerHTML = hero('Conflicts', 'Restricted.',
      'The conflicts queue is visible to risk and compliance roles.', ['intapp']);
    return;
  }

  var hits = HITS();
  var pending = hits.filter(function (h) { return h.pending; });
  var declined = hits.filter(function (h) { return h.res.indexOf('Declined') === 0; });
  var screened = hits.filter(function (h) { return h.res.indexOf('screen') !== -1; });
  var waivers = hits.filter(function (h) { return h.res.indexOf('waiver') !== -1; });

  var kpis = [
    kpi('Searches this year', fmtN(hits.length * 7), 'run at intake', '',
      'Every new matter triggers a search across clients, adverse parties and corporate families'),
    kpi('Hits raised', fmtN(hits.length), fmtPct(hits.length / (hits.length * 7) * 100) + ' of searches', ''),
    kpi('Awaiting resolution', fmtN(pending.length), pending.length ? 'oldest ' + Math.max.apply(null, pending.map(function (h) { return h.days; })) + ' days' : 'queue clear',
      pending.length ? 'amber' : 'green'),
    kpi('Declined', fmtN(declined.length), 'unwaivable', declined.length ? 'amber' : 'green',
      'Work the firm turned away|A number worth knowing — it is the price of the client base the firm already has'),
    kpi('Cleared by waiver', fmtN(waivers.length), 'consent on file', 'green'),
    kpi('Cleared by screen', fmtN(screened.length), 'wall erected ' + tie('/law/walls/', 'Walls'), ''),
    kpi('Corporate families expanded', fmtN(M.clients.length), 'entities resolved to parents', '',
      'A search that does not expand the corporate family is not a search|Subsidiaries are where conflicts hide'),
    kpi('Median clearance', '1.8 days', 'hit raised to resolved', 'green'),
  ];
  while (kpis.length % 4 !== 0) kpis.pop();

  /* live search demo */
  var searchPanel = '';
  if (cfView === 'search' && cfQuery.trim()) {
    var q = cfQuery.toLowerCase().trim();
    var matchClients = M.clients.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
    var matchMatters = scopeMatters(M.matters).filter(function (m) {
      return m.name.toLowerCase().indexOf(q) !== -1 || m.clientName.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);
    searchPanel = panel('Search results — "' + esc(cfQuery) + '"',
      srcChip('intapp') + ' ' + srcChip('e3e') + ' · clients, matters and corporate families',
      (matchClients.length || matchMatters.length
        ? '<div class="demo-tbl-wrap grid-scroll"><table class="demo-tbl">' +
          '<thead><tr><th class="first-sticky">Match</th><th>Type</th><th>Relationship</th><th>Detail</th><th>Assessment</th></tr></thead><tbody>' +
          matchClients.map(function (c) {
            return '<tr><td class="first-sticky"><b>' + esc(c.name) + '</b></td>' +
              '<td>Client</td><td>Current client</td>' +
              '<td style="font-size:11.5px">' + esc(c.industry) + ' · client since ' + c.since + '</td>' +
              '<td>' + pill('DIRECT ADVERSE IF OPPOSED', 'red') + '</td></tr>';
          }).join('') +
          matchMatters.map(function (m) {
            return '<tr><td class="first-sticky"><b>' + esc(m.name.slice(0, 38)) + '</b></td>' +
              '<td>Matter</td><td>' + (m.active ? 'Active' : 'Closed') + '</td>' +
              '<td style="font-size:11.5px">' + esc(m.clientName) + ' · ' + esc(m.practice) + '</td>' +
              '<td>' + pill(m.active ? 'REVIEW REQUIRED' : 'FORMER — CHECK LOOK-BACK', m.active ? 'red' : 'amber') + '</td></tr>';
          }).join('') +
          '</tbody></table></div>'
        : '<div style="padding:22px 4px;color:var(--color-text-muted);font-size:13px">No matches across clients, matters or corporate families. ' +
          'A clean search still needs a positional review before clearing.</div>'),
      ' style="margin-bottom:18px"');
  }

  /* queue */
  var tbl = '<div class="demo-tbl-wrap grid-scroll" style="max-height:560px"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Matter</th><th>Client</th><th>Adverse / related party</th>' +
    '<th>Hit type</th><th>Raised by</th><th class="r">Days</th><th>Resolution</th></tr></thead><tbody>' +
    hits.slice(0, 50).map(function (h) {
      return '<tr><td class="first-sticky"><b>' + esc(h.m.name.slice(0, 36)) + '</b>' +
          '<div style="font-size:10.5px;color:var(--color-slate-hint)">' + h.m.id + ' · ' + fmtDate(h.raised) + '</div></td>' +
        '<td style="font-size:11.5px">' + esc(h.m.clientName) + '</td>' +
        '<td style="font-size:11.5px">' + esc(h.against) + '</td>' +
        '<td><span style="font-size:11px;font-weight:700">' + esc(h.type) + '</span>' +
          '<div style="font-size:10.5px;color:var(--color-slate-hint);max-width:30ch">' + esc(h.typeDesc) + '</div></td>' +
        '<td style="font-size:11.5px">' + esc(h.by) + '</td>' +
        '<td class="r">' + (h.pending ? h.days : '—') + '</td>' +
        '<td>' + pill(h.res.toUpperCase().slice(0, 26), h.resTone) + '</td></tr>';
    }).join('') +
    '</tbody><tfoot><tr class="totals-row"><td class="first-sticky"><b>' + fmtN(hits.length) + ' hits</b></td>' +
      '<td></td><td></td><td></td><td></td>' +
      '<td class="r"><b>' + fmtN(pending.length) + ' pending</b></td><td></td></tr></tfoot></table></div>';

  /* hit-type breakdown */
  var byType = HIT_TYPES.map(function (t) {
    var inT = hits.filter(function (h) { return h.type === t[0]; });
    return { t: t, n: inT.length, declined: inT.filter(function (h) { return h.res.indexOf('Declined') === 0; }).length };
  }).sort(function (a, b) { return b.n - a.n; });
  var typeTbl = '<div class="demo-tbl-wrap grid-scroll"><table class="demo-tbl">' +
    '<thead><tr><th class="first-sticky">Hit type</th><th>What it means</th><th class="r">Raised</th>' +
    '<th class="r">Declined</th><th class="r">Clear rate</th></tr></thead><tbody>' +
    byType.map(function (x) {
      return '<tr><td class="first-sticky"><b>' + esc(x.t[0]) + '</b></td>' +
        '<td style="font-size:11.5px;color:var(--color-text-muted);max-width:44ch">' + esc(x.t[1]) + '</td>' +
        '<td class="r">' + fmtN(x.n) + '</td>' +
        '<td class="r" style="color:' + (x.declined ? 'var(--color-red)' : 'var(--color-slate-hint)') + '">' + (x.declined || '—') + '</td>' +
        '<td class="r">' + (x.n ? fmtPct((1 - x.declined / x.n) * 100) : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  var searchBox =
    '<div class="flt-row">' +
      '<input class="flt-q" placeholder="Search a party, company or individual…" value="' + esc(cfQuery) + '" ' +
        'oninput="cfSet(\'q\',this.value)" onkeydown="if(event.key===\'Enter\')cfSearch()" style="min-width:280px">' +
      '<button class="nav-cta" style="border:0;border-radius:var(--radius-sm);color:#fff;font:inherit;font-size:12px;font-weight:800;padding:8px 20px;cursor:pointer" onclick="cfSearch()">Run search</button>' +
    '</div>' +
    '<div style="margin-top:10px;font-size:11.5px;color:var(--color-slate-hint);line-height:1.55">' +
      'Searches clients, matters, adverse parties and expanded corporate families in one pass. ' +
      'Try a name from the client book — the point is that the search reaches everything at once rather than four systems in sequence.' +
    '</div>';

  var secHead = function (t, n) {
    return '<div class="sec-head"><h2>' + t + '</h2><span class="rule"></span>' + (n ? '<span class="note">' + n + '</span>' : '') + '</div>';
  };

  document.getElementById('root').innerHTML =
    wallNotice() +
    hero('Conflicts — ' + M.asOfLabel,
      pending.length ? fmtN(pending.length) + ' hits <em>awaiting a decision</em>.' : 'Queue <em>clear</em>.',
      'Every new matter searches clients, matters, adverse parties and expanded corporate families in one pass. ' +
      'Median clearance is under two days; what stretches it is always a hit that needs a human judgement.',
      ['intapp', 'e3e']) +
    '<div class="demo-kpis k4">' + kpis.join('') + '</div>' +

    secHead('Run a search', 'clients · matters · corporate families') +
    panel('Conflicts search', srcChip('intapp'), searchBox, ' style="margin-bottom:18px"') +
    searchPanel +

    secHead('Resolution queue', fmtN(hits.length) + ' hits') +
    panel('Hits', srcChip('intapp') + ' ' + srcChip('e3e'), tbl, ' style="margin-bottom:18px"') +

    secHead('By hit type', 'what actually turns up') +
    panel('Taxonomy', srcChip('intapp'), typeTbl);
}

if (isSignedIn()) render();
</script>
</body>
</html>
